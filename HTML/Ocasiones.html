<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocasiones Especiales - Luna Cabina</title>
    <link rel="stylesheet" href="../css/admin-content.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 30px;
        }
        h1 span {
            color: #FFA0A0;
        }
        .occasions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .occasion-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .occasion-card:hover {
            transform: translateY(-5px);
        }
        .occasion-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .occasion-content {
            padding: 20px;
        }
        h2 {
            color: #FFA0A0;
            margin-top: 0;
        }
        p {
            margin-bottom: 10px;
        }
        .occasion-date {
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>Ocasiones</span> Especiales</h1>
        <div class="occasions-grid" id="occasionsContainer"></div>
        <p class="managed-empty" id="occasionsEmpty">Pronto compartiremos nuevas ocasiones especiales.</p>
    </div>

    <script>
        (() => {
            const container = document.getElementById('occasionsContainer');
            const empty = document.getElementById('occasionsEmpty');
            const localDate = new Date();
            localDate.setMinutes(localDate.getMinutes() - localDate.getTimezoneOffset());
            const today = localDate.toISOString().slice(0, 10);
            const formatDate = (value) => {
                const [year, month, day] = value.split('-').map(Number);
                return new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(year, month - 1, day)));
            };

            const renderOccasions = (data) => {
                const occasions = Array.isArray(data.occasions) ? data.occasions.filter((item) => item && item.date >= today && item.title && item.image) : [];
                occasions.sort((a, b) => a.date.localeCompare(b.date)).forEach((occasion) => {
                    const card = document.createElement('article');
                    card.className = 'occasion-card managed-card';
                    const image = document.createElement('img');
                    image.className = 'occasion-image';
                    image.src = occasion.image;
                    image.alt = occasion.title;
                    image.loading = 'lazy';
                    const copy = document.createElement('div');
                    copy.className = 'occasion-content managed-card-copy';
                    const title = document.createElement('h2');
                    title.textContent = occasion.title;
                    const description = document.createElement('p');
                    description.textContent = occasion.description || '';
                    const date = document.createElement('p');
                    date.className = 'occasion-date managed-date';
                    date.textContent = formatDate(occasion.date);
                    copy.append(title, description, date);
                    card.append(image, copy);
                    container.append(card);
                });
                empty.hidden = occasions.length > 0;
            };

            fetch('/api/content.php').then((response) => response.ok ? response.json() : Promise.reject()).then(renderOccasions).catch(() => {
                empty.textContent = 'No pudimos cargar las ocasiones.';
            });
        })();
    </script>
</body>
</html>
